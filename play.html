<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 3rem;
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  max-width: 700px;
  margin: auto;
}

.cell {
  background: white;
  border: 2px solid #ccc;
  border-radius: 16px;
  min-height: 180px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 20px;

  cursor: pointer;
}

.cell.correct {
  background: #dcfce7;
  border-color: green;
}

.clue {
  font-size: 1.1rem;
  margin-bottom: 20px;
}

.select-text {
  font-size: 1.4rem;
  font-weight: bold;
}

.answer-text {
  font-size: 1.8rem;
  font-weight: bold;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.hidden {
  display: none;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 500px;

  border-radius: 16px;

  padding: 20px;
}

#searchBox {
  width: 100%;
  padding: 14px;
  font-size: 1.1rem;

  border-radius: 10px;
  border: 1px solid #ccc;

  margin-bottom: 20px;

  box-sizing: border-box;
}

.results {
  max-height: 300px;
  overflow-y: auto;
}

.station-option {
  padding: 14px;
  font-size: 1.1rem;

  border-radius: 10px;

  cursor: pointer;
}

.station-option:hover {
  background: #eff6ff;
}

@media (max-width: 700px) {

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<h1>The Route</h1>

<div class="grid" id="grid"></div>

<div class="modal hidden" id="modal">

  <div class="modal-content">

    <input
      type="text"
      id="searchBox"
      placeholder="Search station..."
    >

    <div class="results" id="results"></div>

  </div>

</div>

<script>

const puzzle = [

  {
    clue: "Famous Kent seaside terminus",
    answer: "Ramsgate"
  },

  {
    clue: "Next stop after Ramsgate on the loop",
    answer: "Broadstairs"
  },

  {
    clue: "Dreamland station",
    answer: "Margate"
  },

  {
    clue: "Station between Ramsgate and Broadstairs",
    answer: "Dumpton Park"
  }

];

const stations = [

  "Ramsgate",
  "Broadstairs",
  "Margate",
  "Dumpton Park",
  "Canterbury West",
  "Ashford International",
  "Whitstable",
  "Herne Bay",
  "Deal",
  "Faversham"

];

const grid = document.getElementById("grid");

const modal = document.getElementById("modal");

const searchBox = document.getElementById("searchBox");

const results = document.getElementById("results");

let activeCell = null;

puzzle.forEach(item => {

  const cell = document.createElement("div");

  cell.className = "cell";

  cell.dataset.answer = item.answer;

  cell.innerHTML = `

    <div>

      <div class="clue">
        ${item.clue}
      </div>

      <div class="select-text">
        Select Station
      </div>

    </div>

  `;

  cell.onclick = () => {

    if (cell.classList.contains("correct")) {
      return;
    }

    activeCell = cell;

    openModal();

  };

  grid.appendChild(cell);

});

function openModal() {

  modal.classList.remove("hidden");

  searchBox.value = "";

  renderStations(stations);

  searchBox.focus();

}

function renderStations(list) {

  results.innerHTML = "";

  list.forEach(station => {

    const option = document.createElement("div");

    option.className = "station-option";

    option.textContent = station;

    option.onclick = () => {

      checkAnswer(station);

    };

    results.appendChild(option);

  });

}

searchBox.oninput = () => {

  const value = searchBox.value.toLowerCase();

  const filtered = stations.filter(station =>

    station.toLowerCase().includes(value)

  );

  renderStations(filtered);

};

function checkAnswer(station) {

  if (station === activeCell.dataset.answer) {

    activeCell.classList.add("correct");

    activeCell.innerHTML = `

      <div class="answer-text">
        ${station}
      </div>

    `;

  } else {

    alert("Incorrect station");

  }

  modal.classList.add("hidden");

}

modal.onclick = (event) => {

  if (event.target === modal) {

    modal.classList.add("hidden");

  }

};

</script>

</body>
</html>
