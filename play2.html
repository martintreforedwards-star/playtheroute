<script>

let stations = [];

fetch(
  "data/stations/southeastern.json"
)
.then(response => response.json())
.then(data => {

  console.log(data);

  stations = data.map(
    station => station.station_name
  );

  console.log(stations);

})
.catch(error => {

  console.log(error);

});

const cells =
  document.querySelectorAll(".cell");

const modal =
  document.getElementById(
    "station-modal"
  );

const searchInput =
  document.getElementById(
    "search-input"
  );

const stationList =
  document.getElementById(
    "station-list"
  );

const closeBtn =
  document.getElementById(
    "close-btn"
  );

const submitBtn =
  document.getElementById(
    "submit-btn"
  );

let activeCell = null;

cells.forEach(cell => {

  cell.addEventListener(
    "click",
    () => {

      activeCell = cell;

      modal.style.display =
        "flex";

      searchInput.value = "";

      renderStations("");

      setTimeout(() => {

        searchInput.focus();

      }, 50);

    }

  );

});

function renderStations(filter){

  stationList.innerHTML = "";

  const filtered =
    stations.filter(station =>

      station
        .toLowerCase()
        .includes(
          filter.toLowerCase()
        )

    );

  filtered.forEach(station => {

    const div =
      document.createElement("div");

    div.className =
      "station-option";

    div.textContent =
      station;

    div.addEventListener(
      "click",
      () => {

        if(activeCell){

          activeCell.classList.remove(
            "valid",
            "invalid"
          );

          activeCell.innerHTML = `

            <div class="cell-content">

              <div class="station-name">
                ${station}
              </div>

            </div>

          `;

        }

        modal.style.display =
          "none";

      }

    );

    stationList.appendChild(div);

  });

}

searchInput.addEventListener(
  "input",
  () => {

    renderStations(
      searchInput.value
    );

  }

);

closeBtn.addEventListener(
  "click",
  () => {

    modal.style.display =
      "none";

  }

);

window.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){

      modal.style.display =
        "none";

    }

  }

);

submitBtn.addEventListener(
  "click",
  () => {

    let completed = 0;

    cells.forEach(cell => {

      if(
        cell.innerHTML.trim() !== ""
      ){

        const existing =
          cell.querySelector(
            ".cell-status"
          );

        if(existing){

          existing.remove();

        }

        cell.classList.add(
          "valid"
        );

        cell.innerHTML += `

          <div class="cell-status">
            VALID
          </div>

        `;

        completed++;

      }

    });

    if(completed === 8){

      document.getElementById(
        "special-announcement"
      ).style.display =
        "block";

    }

  }

);

</script>
