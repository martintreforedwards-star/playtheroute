<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Play | The Route</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="container">

    <img src="logo.svg" alt="The Route logo" class="logo">

    <h1>The Route</h1>

    <p class="subtitle">Today's Puzzle</p>

    <div class="tickets">
      🎫 🎫 🎫
    </div>

    <div class="grid">

      <!-- Top title -->
      <div class="cell title">Service Updates</div>
      <div class="cell title">A</div>
      <div class="cell title">B</div>

      <!-- Row 1 -->
      <div class="cell row-label">Platform 1</div>
      <div class="cell" onclick="selectCell(this)"></div>
      <div class="cell" onclick="selectCell(this)"></div>

      <!-- Row 2 -->
      <div class="cell row-label">Platform 2</div>
      <div class="cell" onclick="selectCell(this)"></div>
      <div class="cell" onclick="selectCell(this)"></div>

      <!-- Row 3 -->
      <div class="cell row-label">Platform 3</div>
      <div class="cell" onclick="selectCell(this)"></div>
      <div class="cell" onclick="selectCell(this)"></div>

      <!-- Row 4 -->
      <div class="cell row-label">Platform 4</div>
      <div class="cell" onclick="selectCell(this)"></div>
      <div class="cell" onclick="selectCell(this)"></div>

    </div>

    <div class="controls">

      <input
        type="text"
        id="stationInput"
        placeholder="Enter station">

      <button onclick="placeStation()">
        Add Station
      </button>

    </div>

  </div>

  <script src="assets/js/app.js"></script>

</body>

</html>
