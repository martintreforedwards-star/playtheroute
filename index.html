<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>The Route</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: 'Inter', sans-serif;

      background:
        radial-gradient(
          circle at top,
          #0b1836 0%,
          #030817 45%,
          #01040d 100%
        );

      color: white;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px;

    }

    .container {

      width: 100%;
      max-width: 520px;

      text-align: center;

    }

    .logo {

      width: 120px;

      margin-bottom: 30px;

    }

    h1 {

      margin: 0;

      font-size: 4rem;

      font-weight: 700;

      letter-spacing: -2px;

    }

    .subtitle {

      margin-top: 16px;

      font-size: 1.3rem;

      color: #9ca3af;

      line-height: 1.5;

      margin-bottom: 50px;

    }

    .network-selector {

      text-align: left;

      margin-bottom: 30px;

    }

    .network-selector label {

      display: block;

      margin-bottom: 12px;

      font-size: 1rem;

      font-weight: 600;

      color: #d1d5db;

    }

    select {

      width: 100%;

      padding: 16px;

      border-radius: 18px;

      border: 2px solid #1e3a8a;

      background: #0f172a;

      color: white;

      font-size: 1rem;

      outline: none;

      transition: 0.2s;

    }

    select:focus {

      border-color: #22c55e;

    }

    optgroup {

      background: #111827;

      color: #9ca3af;

      font-weight: bold;

    }

    option {

      color: white;

      background: #0f172a;

    }

    .play-button {

      display: block;

      width: 100%;

      text-decoration: none;

      background: #22c55e;

      color: white;

      padding: 20px;

      border-radius: 20px;

      font-size: 1.3rem;

      font-weight: 700;

      transition: 0.2s;

      margin-bottom: 50px;

    }

    .play-button:hover {

      background: #16a34a;

      transform: translateY(-2px);

    }
