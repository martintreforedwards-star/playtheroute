<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>The Route</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
        href="assets/css/style.css">

</head>

<body>

  <div class="container">

    <!-- LOGO -->

    <img
      src="logo.svg"
      alt="The Route logo"
      class="logo">

    <!-- ANNOUNCEMENT -->

    <div class="announcement">

      🚉 Service update:
      The Route is preparing for departure.
      Daily commuter puzzles arriving soon.

    </div>

    <!-- TITLE -->

    <h1>The Route</h1>

    <p class="subtitle">
      Build the route. Find the pattern.
    </p>

    <!-- NETWORK SELECTOR -->

    <div class="network-selector">

      <label for="network">

        Choose your commuter network

      </label>

      <select id="network">

        <optgroup label="Govia Thameslink Railway (GTR)">

          <option>Thameslink</option>

          <option>Southern</option>

          <option>Great Northern</option>

          <option>Gatwick Express</option>

        </optgroup>

        <optgroup label="Southeastern">

          <option>Southeastern Metro</option>

          <option>Southeastern Mainline</option>

        </optgroup>

        <optgroup label="Greater Anglia">

          <option>Greater Anglia</option>

          <option>c2c</option>

        </optgroup>

        <optgroup label="Other Networks">

          <option>South Western Railway</option>

          <option>Chiltern Railways</option>

          <option>Great Western Railway</option>

          <option>East Midlands Railway</option>

          <option>LNER</option>

        </optgroup>

      </select>

    </div>

    <!-- PLAY BUTTON -->

    <a href="play.html"
       class="play-button">

      Play Today's Route

    </a>

    <!-- FOOTER -->

    <p class="footer-text">

      Built for UK commuters.

    </p>

  </div>

</body>

</html>
