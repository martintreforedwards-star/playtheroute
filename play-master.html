<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background:
    linear-gradient(
      180deg,
      #00133d 0%,
      #000814 100%
    );
  color: white;
}

.container {
  width: 100%;
  max-width: 1180px;
  margin: auto;
  padding: 28px 20px 60px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 30px;
}

.header-home-link {
  color: #94a3b8;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 8px 14px;
}

.header-home-link:hover {
  color: white;
  border-color: #64748b;
}

.header-map-link {
  color: #94a3b8;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 8px 14px;
  background: transparent;
  font-family: inherit;
  cursor: pointer;
}

.header-map-link:hover {
  color: white;
  border-color: #64748b;
}

.logo {
  width: 220px;
  height: auto;
  display: block;
}

.title-block h1 {
  margin: 0;
  font-size: clamp(
    2.4rem,
    5vw,
    4.2rem
  );
  line-height: 1;
  font-weight: 800;
}
.copyright-mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:0.75em;
  height:0.75em;

  margin-left:-0.03em;

  border:1.5px solid currentColor;
  border-radius:50%;

  font-size:0.18em;
  font-weight:700;

  position:relative;
  top:-0.55em;
}
.subtitle {
  margin-top: 8px;
  color: rgba(255,255,255,0.6);
  font-size: 1rem;
}

.panel {
  border: 1px solid rgba(
    255,
    255,
    255,
    0.18
  );
  background: rgba(
    255,
    255,
    255,
    0.02
  );
  padding: 24px;
  margin-bottom: 26px;
  border-radius: 22px;
}

.panel-title {
  color: #22c55e;
  font-size: 0.95rem;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

.game-table-wrapper {
  overflow-x: auto;
}

.game-table {
  width: 100%;
  min-width: 820px;
  border-collapse: separate;
  border-spacing: 10px;
  table-layout: fixed;
}

.game-table th,
.game-table td {
  vertical-align: middle;
}

.top-heading {
  text-align: center;
  font-size: 1.5rem;
  padding: 20px;
}

.side-heading {
  width: 220px;
  text-align: left;
  border-radius: 20px;
  background: rgba(
    15,
    23,
    42,
    0.95
  );
  padding: 18px;
}

.side-heading .p-label {
  font-weight: 700;
  margin-bottom: 8px;
}

.side-heading .p-clue {
  font-size: 1rem;
  line-height: 1.45;
  color: rgba(
    255,
    255,
    255,
    0.92
  );
}

.p1 {
  color: #22c55e;
}

.p2 {
  color: #60a5fa;
}

.col-heading {
  font-size: 1rem;
  line-height: 1.45;
  text-align: center;
  background: rgba(
    15,
    23,
    42,
    0.95
  );
  border-radius: 20px;
  padding: 20px;
}
.game-grid {

  display: grid;

  grid-template-columns: 108px repeat(2, minmax(130px,1fr));

  gap: 10px;

  width: 100%;

  align-items: stretch;

}

.corner {
  background: transparent;
}

.column-header {

  background: rgba(15,23,42,0.95);

  border-radius: 18px;

  padding: 8px 4px;

  text-align: center;

 height: 78px;

  display: flex;

  flex-direction: column;

  justify-content: center;

}

.column-header strong {
  font-size: 1.1rem;
}

.column-clue {

  margin-top: 4px;

  color: #d1d5db;

  font-size: 0.58rem;

  line-height: 1.25;

}

.row-header {

  border-radius: 18px;

  padding: 8px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  min-height: 140px;

}

.row-header strong {

  font-size: 1.05rem;

  margin-bottom: 4px;

}

.row-header span {

  font-size: 0.72rem;

  line-height: 1.3;

}

.row-header.green,
.row-header.blue {

  background: rgba(15,23,42,0.95);

  border-left: 4px solid rgba(255,255,255,0.35);

}
.cell {
  height: 140px;
  cursor: pointer;
  transition: 0.15s;
  position: relative;
  border-radius: 22px;
  background: rgba(
    10,
    20,
    50,
    0.95
  );
  border: 2px solid #1d4ed8;
}

.cell.disabled-used {
  cursor: not-allowed;
  opacity: 0.55;
}

.cell:hover {
  transform: translateY(-2px);
  border-color: #3b82f6;
}

.cell.correct{
  background:linear-gradient(
    to bottom,
    #0f172a 0%,
    #0f172a 28%,
    #74c08f 28%,
    #69b483 100%
  );
  border:2px solid #7bd39f;
  border-radius:8px;
  box-shadow:none;
}

.cell.correct .station-name{
  color:#04160c;
  font-size:1.05rem;
  font-weight:900;
}

.cell.correct .validation{
  color:#0b2a16;
  font-weight:800;
  background:rgba(255,255,255,0.35);
  border-radius:4px;
  padding:1px 6px;
  display:inline-block;
}

.cell.correct .cell-inner{
  margin-top:4px;
}

.cell.correct::before{
  content:"";
  position:absolute;
  top:8px;
  left:12px;
  right:12px;
  height:18px;
  background:repeating-linear-gradient(
    to right,
    rgba(190,220,245,.95) 0 24px,
    transparent 24px 38px
  );
}

.cell.correct::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:7px;
  background:#111827;
}
/* TRAIN HARDWARE */

.bogie{
  position:absolute;
  bottom:-7px;
  width:60px;
  height:12px;
  background:#05070a;
  border-radius:4px;
  z-index:1;
}

.bogie.left{
  left:18px;
}

.bogie.right{
  right:18px;
}

.wheel{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#05070a;
  border:2px solid #000;
  bottom:-9px;
  z-index:1;
}

.wheel.l1{
  left:20px;
}

.wheel.l2{
  left:48px;
}

.wheel.r1{
  right:48px;
}

.wheel.r2{
  right:20px;
}

.coupling{
  position:absolute;
  bottom:-14px;
  left:50%;
  width:4px;
  height:18px;
  background:#111827;
  transform:translateX(-50%);
  z-index:5;
}

.cell.correct[data-index="0"],
.cell.correct[data-index="1"]{
  border-radius:22px 22px 8px 8px;
}

.cell.correct[data-index="6"],
.cell.correct[data-index="7"]{
  clip-path:polygon(
    0 0,
    100% 0,
    100% 88%,
    50% 100%,
    0 88%
  );
}
.cell.incorrect {
  background: rgba(
    140,
    0,
    0,
    0.95
  );
  border-color: #ef4444;
}

.cell-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 12px;
}

.station-name {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}

.validation {
  margin-top: 10px;
  font-size: 0.72rem;
  letter-spacing: 2px;
  text-align: center;
  opacity: 0.85;
}

.empty-label {
  color: #94a3b8;
  font-size: 0.9rem;
  font-weight: 700;
}

.reveal-hint-btn {
  margin-top: 8px;
  border: 1px solid rgba(251,191,36,0.5);
  background: rgba(251,191,36,0.12);
  color: #fbbf24;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 5px 8px;
  border-radius: 999px;
  cursor: pointer;
  line-height: 1.2;
}

.reveal-hint-btn:hover {
  background: rgba(251,191,36,0.22);
}

.reveal-hint-text {
  margin-top: 8px;
  color: #fbbf24;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.footer-row {
  display: flex;
  gap: 24px;
  margin-top: 28px;
  align-items: stretch;
  justify-content: center;
}

/* The submit-route button is the sole child of .footer-row, so the shared
   .submit-button class's flex:1 stretched it edge-to-edge - reading as
   oversized compared to the other action buttons that share the class.
   Scoped here (not on .submit-button itself) so the smaller share/copy/
   bonus buttons elsewhere keep their existing inline sizing untouched. */
.footer-row .submit-button {
  flex: 0 1 auto;
  width: 100%;
  max-width: 320px;
}

.corner {
  display: flex;
  align-items: stretch;
}

.status-cell {
  width: 100%;
}

.ticket-box {
  width: 100%;
  height: 78px;
  border: 1px solid rgba(
    255,
    255,
    255,
    0.18
  );
  border-left: 4px solid rgba(255,255,255,0.35);
  padding: 6px 4px;
  border-radius: 18px;
  background: rgba(
    15,
    23,
    42,
    0.95
  );
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.ticket-box.urgent {
  border-color: #ef4444;
  border-left-color: #ef4444;
  background: rgba(60,10,10,0.95);
}

.ticket-box.urgent .ticket-number {
  color: #f87171;
}

.ticket-title {
  color: rgba(
    255,
    255,
    255,
    0.65
  );
  font-size: 0.6rem;
  line-height: 1.2;
  margin-bottom: 3px;
}

.ticket-number {
  color: #ffffff;
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1;
}

.submit-button {
  flex: 1;
  min-width: 220px;
  border: none;
  border-radius: 18px;
  background: #22c55e;
  color: white;
  font-size: 1.25rem;
  font-weight: 700;
  padding: 14px 20px;
  cursor: pointer;
  transition: opacity 0.15s;
}

.submit-button:hover {
  opacity: 0.92;
}

.route-key {
  margin-top: 28px;
}

.route-key p {
  margin: 0;
  font-size: 1rem;
}

.special-announcement {

  margin-top: 28px;
}

.departure-board {
  margin-top: 18px;
  background: black;
  color: #22ff66;
  padding: 26px;
  text-align: center;
  font-family: monospace;
  font-size: 2rem;
  letter-spacing: 4px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(
    0,
    0,
    0,
    0.8
  );
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal-box {
  width: 100%;
  max-width: 560px;
  background: #07142f;
  border: 1px solid rgba(
    255,
    255,
    255,
    0.15
  );
  padding: 24px;
  max-height: 80vh;
  overflow-y: auto;
  border-radius: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.close-button {
  border: none;
  background: #dc2626;
  color: white;
  width: 34px;
  height: 34px;
  cursor: pointer;
  font-size: 1rem;
  border-radius: 10px;
}

.search-box {
  width: 100%;
  padding: 16px;
  border: none;
  margin-bottom: 18px;
  font-size: 1rem;
  border-radius: 16px;
}

.station-option {
  padding: 14px;
  cursor: pointer;
  border-bottom: 1px solid rgba(
    255,
    255,
    255,
    0.08
  );
}

.station-option:hover {
  background: rgba(
    255,
    255,
    255,
    0.05
  );
}

.station-option.used {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
  text-decoration: line-through;
}

.no-results {
  padding: 18px 14px;
  color: rgba(255,255,255,0.55);
  font-size: 0.92rem;
  text-align: center;
}

.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.6);
  font-size: 1rem;
}

@media (max-width: 760px) {

  .container {
    padding: 18px 14px 40px;
  }

  .panel {
    padding: 18px;
  }
.game-grid {

  grid-template-columns: 70px repeat(2, 1fr);

  gap: 8px;

}
.row-header {
  min-height: 82px;
}
.column-header {
  height: 82px;
}
.ticket-box {
  height: 82px;
  padding: 4px 3px;
}
.ticket-title {
  font-size: 0.5rem;
}
.ticket-number {
  font-size: 1.1rem;
}
.row-header strong {
  font-size: 0.74rem;
}

.row-header span {
  font-size: 0.52rem;
}
.footer-row {
    flex-direction: column;
    align-items: center;
  }

  .footer-row .submit-button {
    min-height: 52px;
    font-size: 1.1rem;
    padding: 10px 20px;
    max-width: 320px;
  }

  .game-table {
    border-spacing: 3px;
  }

  .side-heading {
    width: 55px;
    padding: 4px;
  }

  .side-heading .p-label {
    font-size: 0.7rem;
    margin-bottom: 4px;
  }

.side-heading .p-clue {
  font-size: 0.62rem;
  line-height: 1.2;
}

.col-heading {
  font-size: 0.7rem;
  padding: 6px;
  line-height: 1.2;
}

.cell {
  height: 82px;
  border-radius: 14px;
}

  .cell-inner {
    padding: 4px;
  }

.station-name {
  font-size: 0.72rem;
  line-height: 1.1;
}

  .validation {
    margin-top: 4px;
    font-size: 0.4rem;
    letter-spacing: 1px;
  }

  .empty-label {
    font-size: 0.65rem;
  }

  .reveal-hint-btn {
    font-size: 0.56rem;
    padding: 4px 6px;
    margin-top: 5px;
  }

  .reveal-hint-text {
    font-size: 0.58rem;
    margin-top: 5px;
  }

}

.footer-text {
  text-align: center;
  color: #6b7280;
  font-size: 0.82rem;
  line-height: 1.8;
  margin: 40px auto;
  width: 100%;
}

.footer-text a {
  color: #9ca3af;
  text-decoration: none;
  transition: 0.2s;
  margin: 0 6px;
}

.footer-text a:hover {
  color: white;
}

.stats-row {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.stats-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 64px;
}

.stats-item strong {
  font-size: 1.3rem;
  font-weight: 800;
  color: #22c55e;
  line-height: 1.1;
}

.stats-item span {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  margin-top: 2px;
}

.app-toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px);
  background: rgba(15,23,42,0.97);
  border: 1px solid rgba(255,255,255,0.18);
  color: white;
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
  z-index: 3000;
}

.app-toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.hint-icon-btn {
  margin-top: 5px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
  font-size: 0.62rem;
  font-style: italic;
  font-family: Georgia, serif;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.hint-icon-btn:hover,
.hint-icon-btn.active {
  border-color: #60a5fa;
  color: white;
  background: rgba(96,165,250,0.25);
}

.hint-popover {
  position: fixed;
  z-index: 1500;
  max-width: 240px;
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.25);
  color: #e5e7eb;
  font-size: 0.72rem;
  line-height: 1.35;
  padding: 10px 12px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  display: none;
}

.hint-popover.visible {
  display: block;
}

</style>

<body>

<div class="container">

<div class="header">

  <a href="index.html">
    <img
      src="/CLAUDE/newlogo.svg"
      class="logo"
      alt="The Route">
  </a>

  <div style="display:flex; gap:8px;">
    <a href="/" class="header-home-link" data-i18n="home">
      🏠 Home
    </a>

    <button
      type="button"
      class="header-map-link"
      data-i18n="map"
      onclick="openMapHelp()">
      🗺️ Map
    </button>
  </div>

</div>


  <div class="game-grid" id="gameGrid">

  <div class="corner status-cell">

  <div
    class="ticket-box"
    id="timerBox"
    style="display:none;">

    <div class="ticket-title" data-i18n="time_left">
      Time left
    </div>

    <div
      class="ticket-number"
      id="timerCount">

      03:00

    </div>

  </div>
    <div class="ticket-box">

      <div class="ticket-title" data-i18n="tickets_left">
        Tickets left
      </div>

      <div
        class="ticket-number"
        id="ticketCount">

        6

      </div>

    </div>

</div>

  <div class="column-header" style="border-left:4px solid #22c55e; background:rgba(15,23,42,0.95);">
    <strong data-i18n="platform_1">Platform 1</strong>
    <div class="column-clue" id="rowClue0"></div>
    <button type="button" class="hint-icon-btn" id="hintIcon-col0" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>

  <div class="column-header" style="border-left:4px solid #60a5fa; background:rgba(15,23,42,0.95);">
    <strong data-i18n="platform_2">Platform 2</strong>
    <div class="column-clue" id="rowClue1"></div>
    <button type="button" class="hint-icon-btn" id="hintIcon-col1" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>

  <div class="row-header green">
    <strong>A</strong>
    <span id="colClue0"></span>
    <button type="button" class="hint-icon-btn" id="hintIcon-row0" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>

  <div class="row-header blue">
    <strong>B</strong>
    <span id="colClue1"></span>
    <button type="button" class="hint-icon-btn" id="hintIcon-row1" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>

  <div class="row-header green">
    <strong>C</strong>
    <span id="colClue2"></span>
    <button type="button" class="hint-icon-btn" id="hintIcon-row2" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>

  <div class="row-header blue">
    <strong>D</strong>
    <span id="colClue3"></span>
    <button type="button" class="hint-icon-btn" id="hintIcon-row3" aria-label="Hint" data-i18n-aria="hint">i</button>
  </div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>

</div>

  <div class="footer-row">
    <button
      class="submit-button"
      id="submitButton"
      data-i18n="submit_route">

      Submit route

    </button>

  </div>
<div
    class="panel final-destination"
    id="specialAnnouncement">

    <div class="panel-title" data-i18n="landmark_challenge">
      Landmark Challenge
    </div>

 function pickRandom(array, count) {

  const shuffled =
    [...array].sort(
      () => Math.random() - 0.5
    );

  return shuffled.slice(
    0,
    count
  );
 }
function weightedPick(pool) {

  const weights = {
  high: 6,
  medium: 3,
  low: 1
};

  const expanded = [];

  pool.forEach(clue => {

    const weight =
      weights[
        clue.weight || "medium"
      ] || 1;

    for (
      let i = 0;
      i < weight;
      i++
    ) {
      expanded.push(clue);
    }

  });

  return expanded[
    Math.floor(
      Math.random() *
      expanded.length
    )
  ];

}

function weightedUniquePick(
  pool,
  count
) {

  const selected = [];

  while (
    selected.length < count
  ) {

    const clue =
      weightedPick(pool);

    if (
      !selected.includes(clue)
    ) {

      selected.push(clue);

    }

  }

  return selected;

}

function columnRulePasses(station, clue) {

  if (clue.type === "array_contains") {

    return (
      Array.isArray(station[clue.field]) &&
      station[clue.field].includes(clue.value)
    );

  }

  if (clue.type === "range") {

    const value =
      Number(station[clue.field]);

    if (
      clue.min !== undefined &&
      value < clue.min
    ) {
      return false;
    }

    if (
      clue.max !== undefined &&
      value > clue.max
    ) {
      return false;
    }

    return true;

  }

  if (clue.type === "contains") {

    return String(
      station[clue.field]
    )
      .toLowerCase()
      .includes(
        clue.value.toLowerCase()
      );

  }

  return (
    station[clue.field] ===
    clue.value
  );

}
function boardIsPlayable(rows, columns) {

  for (let r = 0; r < 2; r++) {

    for (let c = 0; c < 4; c++) {

      const matches = stations.filter(station => {

        const rowPass =
          station[rows[r].field] === rows[r].value;

        const colPass =
          columnRulePasses(station, columns[c]);

        return rowPass && colPass;

      });

      if (matches.length === 0) {
        return false;
      }

    }

  }

  return true;
}

// Single shared matcher for BOTH row and column clues - used to be two
// separate implementations (the row check only ever did a bare equality
// comparison with no clue.type handling at all), which silently broke
// any range-type clue (e.g. name_letter_count bands) landing in the row/
// platform slot: rowClue.value is undefined for a range clue, so the old
// row check's `!==` comparison was true for nearly every station,
// permanently failing that whole platform column. Kept as one function
// so row and column checks can never drift apart like that again.
function clueMatches(station, clue) {

  if (clue.type === "array_contains") {

    return (
      Array.isArray(station[clue.field]) &&
      station[clue.field].includes(clue.value)
    );

  }

  if (clue.type === "range") {

    const value = Number(station[clue.field]);

    if (Number.isNaN(value)) {
      return false;
    }

    if (clue.min !== undefined && value < clue.min) {
      return false;
    }

    if (clue.max !== undefined && value > clue.max) {
      return false;
    }

    return true;

  }

  if (clue.type === "contains") {

    const text = String(station[clue.field]).toLowerCase();

    return text.includes(String(clue.value).toLowerCase());

  }

  // equals (default)
  return station[clue.field] === clue.value;

}

function validateCell(
  station,
  row,
  column,
  usedStations
) {

  let valid = true;

  const rowClue = activeRows[row];

  if (!clueMatches(station, rowClue)) {

    valid = false;

  }

  const clue = activeColumns[column];

  if (!clueMatches(station, clue)) {

    valid = false;

  }

  if (
    usedStations.includes(
      station.station_name
    )
  ) {

    valid = false;

  }

  return valid;

}

  const board =

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+- ";

  let frame = 0;

  const timer =
    setInterval(() => {

      let display = "";

      for (
        let i = 0;
        i < finalText.length;
        i++
      ) {

        if (
          frame > i * 2
        ) {

          display += finalText[i];

        } else {

          display += chars[
            Math.floor(
              Math.random() * chars.length
            )
          ];

        }

      }

      board.innerHTML = display;

      frame++;

      if (
        frame >
        finalText.length * 2
      ) {

        clearInterval(timer);

        board.innerHTML = finalText;

      }

    }, 80);

}

      challenge.closest_station;

    // Station fact always describes the actual landmark just asked about,
    // not a name-keyed lookup that can silently pull a different landmark's
    // fact if two landmarks in the network share the same closest_station.
    const factText =
      challenge && challenge.facts && challenge.facts.length
        ? `${challenge.landmark} (${challenge.distance_km}km away) - ${challenge.facts[0]}`
        : "";

    if (!valid) {

      ticketsRemaining = Math.max(0, ticketsRemaining - 1);

      updateTicketDisplay();

      document.getElementById(
        "bonusMessage"
      ).innerHTML =
        `${t('incorrect_station')}<br><br>
         ${t('correct_answer')}
         <strong>${challenge.closest_station}</strong>`;

    } else {

      ticketsRemaining++;

      updateTicketDisplay();

      document.getElementById(
        "bonusMessage"
      ).textContent =
        t('return_ticket_earned');

    }

    document.getElementById(
      "bonusSelectButton"
    ).style.display = "none";

    document.getElementById(
      "bonusSelectedStation"
    ).style.display = "none";

    document.getElementById(
      "bonusSelectButton"
    ).disabled = true;

    // One guess either way - always proceeds to the results modal now.
    showResultsModal(valid);

    // Explicit answer reveal inside the modal itself - previously this
    // only lived in the Landmark Challenge panel behind the modal, so it
    // was invisible unless the player closed the modal to check. Now
    // stated plainly for both outcomes.
    document.getElementById(
      "landmarkAnswerReveal"
    ).innerHTML = valid
      ? `${t('landmark_correct_prefix')} <strong>${challenge.closest_station}</strong> ${t('landmark_correct_suffix')} ${challenge.landmark}.`
      : `${t('landmark_incorrect_prefix')} <strong>${selectedBonusStation.station_name}</strong>. ` +
        `${t('landmark_incorrect_suffix_1')} ${challenge.landmark} ${t('landmark_incorrect_suffix_2')} <strong>${challenge.closest_station}</strong>.`;

    document.getElementById(
      "stationFact"
    ).innerHTML =
      factText
        ? `<strong>${t('station_fact')}</strong><br>${factText}`
        : "";

  }
);

closeModal();

let latestResultTitle = "";

const originalShowResultsModal = showResultsModal;
showResultsModal = function(win=false){
  originalShowResultsModal(win);
  latestResultTitle = document.getElementById("resultsClass").textContent;
  const stats = recordGameResult(win);
  renderStats(stats);
};

// --- Running stats (stored locally per-device in the browser) ---
const STATS_KEY = "theRouteStats";

function getStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(err) {}
  return { gamesPlayed: 0, gamesWon: 0, currentStreak: 0, maxStreak: 0 };
}

function recordGameResult(win) {
  const stats = getStats();
  stats.gamesPlayed += 1;
  if (win) {
    stats.gamesWon += 1;
    stats.currentStreak += 1;
    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
  } else {
    stats.currentStreak = 0;
  }
  try {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  } catch(err) {}
  return stats;
}

function renderStats(stats) {
  const el = document.getElementById("resultsStats");
  if (!el) return;
  const winRate = stats.gamesPlayed
    ? Math.round((stats.gamesWon / stats.gamesPlayed) * 100)
    : 0;
  el.innerHTML = `
    <div class="stats-row">
      <div class="stats-item"><strong>${stats.gamesPlayed}</strong><span>Played</span></div>
      <div class="stats-item"><strong>${winRate}%</strong><span>Win rate</span></div>
      <div class="stats-item"><strong>${stats.currentStreak}</strong><span>Streak</span></div>
      <div class="stats-item"><strong>${stats.maxStreak}</strong><span>Best streak</span></div>
    </div>
  `;
}

function buildShareGrid() {
  return boardState.map(c => c.correct ? "🟩" : "🟥").join("");
}

// Reliable clipboard copy with a fallback for browsers/contexts where the
// modern Clipboard API is unavailable or blocked (older browsers, some
// in-app WebViews, non-HTTPS previews).
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(err) {}

  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(err) {
    return false;
  }
}

function showToast(message) {
  let toast = document.getElementById("appToast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "appToast";
    toast.className = "app-toast";
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add("visible");
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => {
    toast.classList.remove("visible");
  }, 2200);
}

document.addEventListener("click", async (e) => {

  if (e.target && e.target.id === "shareButton") {

    const text =
`🚆 The Route
${latestResultTitle}

🎟 ${t('tickets_remaining_prefix')}${ticketsRemaining}

${buildShareGrid().slice(0,4)}
${buildShareGrid().slice(4,8)}

https://playtheroute.uk`;

    if (navigator.share) {
      try {
        await navigator.share({ title: "The Route", text: text });
        return;
      } catch(err) {
        if (err && err.name === "AbortError") return;
        // fall through to clipboard copy on any other share failure
      }
    }

    const ok = await copyText(text);
    showToast(ok ? t('result_copied') : t('copy_failed'));
  }

  if (e.target && e.target.id === "copyLinkButton") {

    const url = window.location.href.split("#")[0];
    const ok = await copyText(url);
    showToast(ok ? t('link_copied') : t('copy_failed'));
  }

  if (e.target && e.target.id === "shareImageButton") {

    const canvas = document.createElement("canvas");
    canvas.width = 1200;
    canvas.height = 1200;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#07142f";
    ctx.fillRect(0,0,1200,1200);

    ctx.fillStyle = "#22c55e";
    ctx.font = "bold 72px Arial";
    ctx.textAlign = "center";
    ctx.fillText("THE ROUTE",600,140);

    ctx.fillStyle = "white";
    ctx.font = "48px Arial";
    ctx.fillText(latestResultTitle,600,250);

    ctx.fillText("Tickets Remaining: " + ticketsRemaining,600,340);

    const grid = buildShareGrid();

    ctx.font = "100px Arial";
    ctx.fillText(grid.slice(0,4),600,520);
    ctx.fillText(grid.slice(4,8),600,650);

    ctx.font = "40px Arial";
    ctx.fillStyle = "#9ca3af";
    ctx.fillText("playtheroute.uk",600,1000);

    canvas.toBlob(async (blob) => {

      const file = new File([blob], "the-route-score.png", {type:"image/png"});

      if (navigator.canShare && navigator.canShare({files:[file]})) {

        try {
          await navigator.share({
            files:[file],
            title:"The Route"
          });
          return;
        } catch(err) {}
      }

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "the-route-score.png";
      link.click();

    });
  }
});
