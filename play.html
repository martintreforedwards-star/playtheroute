<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #071a2f;
  color: white;
  overflow-x: hidden;
}

.container {
  max-width: 700px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  margin-bottom: 30px;
  color: #c7d4e5;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  width: 100%;
}

.cell {
  background: #102847;
  border: 2px solid #284d7a;
  border-radius: 12px;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  font-size: 16px;
  font-weight: bold;
  word-break: break-word;
}

.cell:hover {
  background: #18365d;
}

.cell.empty {
  color: #8da5bf;
}

.cell.correct {
  background: #1d6b3a;
  border-color: #34c26b;
  color: white;
}

.cell.incorrect {
  background: #7b1f1f;
  border-color: #ff5d5d;
  color: white;
}

.controls {
  margin-top: 25px;
  text-align: center;
}

button {
  background: #2b8cff;
  border: none;
  color: white;
  font-size: 18px;
  padding: 14px 26px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1976e6;
}

.result {
  margin-top: 20px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal-content {
  background: #102847;
  width: 100%;
  max-width: 500px;
  border-radius: 14px;
  padding: 20px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-title {
  margin-bottom: 15px;
  font-size: 22px;
  text-align: center;
}

.station-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.station-option {
  background: #1b3c66;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.station-option:hover {
  background: #28558f;
}

.close-btn {
  margin-top: 15px;
  width: 100%;
  background: #666;
}

.close-btn:hover {
  background: #777;
}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .cell {
    min-height: 80px;
    font-size: 14px;
    padding: 10px;
  }

  button {
    width: 100%;
  }

}

</style>

</head>

<body>

<div class="container">

  <h1>The Route</h1>

  <div class="subtitle">
    Tap each box to choose a station
  </div>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <button id="submitBtn">Submit Answers</button>
  </div>

  <div class="result" id="result"></div>

</div>

<div class="modal" id="modal">

  <div class="modal-content">

    <div class="modal-title">
      Select a Station
    </div>

    <div class="station-list" id="stationList"></div>

    <button class="close-btn" id="closeModalBtn">
      Close
    </button>

  </div>

</div>

<script>

let stations = [];

const answers = [
  "London Victoria",
  "Bromley South",
  "Rochester",
  "Canterbury East",
  "Margate",
  "Dover Priory",
  "Tunbridge Wells",
  "Hastings"
];

const boardState = [
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false },
  { value: "", correct: false }
];

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const stationList = document.getElementById("stationList");
const result = document.getElementById("result");

let currentCellIndex = null;

async function loadStations() {

  try {

    const response = await fetch("southeastern.json");

    stations = await response.json();

    renderGrid();

  } catch (error) {

    console.error("Error loading southeastern.json", error);

    alert("Could not load station data.");

  }

}

function renderGrid() {

  grid.innerHTML = "";

  boardState.forEach((cellData, index) => {

    const cell = document.createElement("div");

    cell.className = "cell";

    if (!cellData.value) {
      cell.classList.add("empty");
      cell.textContent = "Select Station";
    } else {
      cell.textContent = cellData.value;
    }

    if (cellData.correct === true) {
      cell.classList.add("correct");
    }

    if (cellData.correct === false && cellData.value !== "") {
      cell.classList.add("incorrect");
    }

    cell.addEventListener("click", () => {
      openModal(index);
    });

    grid.appendChild(cell);

  });

}

function openModal(index) {

  currentCellIndex = index;

  stationList.innerHTML = "";

  stations.forEach((station) => {

    const option = document.createElement("div");

    option.className = "station-option";

    option.textContent = station;

    option.addEventListener("click", () => {

      boardState[currentCellIndex].value = station;

      boardState[currentCellIndex].correct = null;

      closeModal();

      renderGrid();

    });

    stationList.appendChild(option);

  });

  modal.style.display = "flex";

}

function closeModal() {

  modal.style.display = "none";

}

function validateBoard() {

  let score = 0;

  boardState.forEach((cell, index) => {

    if (cell.value === answers[index]) {

      cell.correct = true;

      score++;

    } else {

      cell.correct = false;

    }

  });

  renderGrid();

  result.textContent = `You scored ${score} / 8`;

}

document.getElementById("submitBtn").addEventListener("click", validateBoard);

document.getElementById("closeModalBtn").addEventListener("click", closeModal);

window.addEventListener("click", (event) => {

  if (event.target === modal) {
    closeModal();
  }

});

loadStations();

</script>

</body>

</html>
