<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #02152b, #031d3a);
  color: white;
  overflow-x: hidden;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

.logo {
  text-align: center;
  font-size: 48px;
  margin-top: 10px;
  margin-bottom: 6px;
}

.logo img {
  width: 70px;
  height: auto;
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 42px;
  font-weight: bold;
  letter-spacing: -1px;
}

.subtitle {
  text-align: center;
  margin-top: 8px;
  margin-bottom: 26px;
  color: #bfd1e5;
  font-size: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.cell {
  background: #112b4d;
  border: 2px solid #2f5e99;
  border-radius: 14px;
  min-height: 82px;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  word-break: break-word;
  line-height: 1.3;
}

.cell:hover {
  background: #173964;
  transform: translateY(-1px);
}

.cell.empty {
  color: #9bb4d1;
}

.cell.correct {
  background: #187245;
  border-color: #37d67a;
  color: white;
}

.cell.incorrect {
  background: #7d2323;
  border-color: #ff6b6b;
  color: white;
}

.controls {
  text-align: center;
  margin-top: 22px;
}

button {
  border: none;
  background: #2d8cff;
  color: white;
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #1977ea;
}

.result {
  margin-top: 18px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 16px;
}

.modal-content {
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  background: #0f2746;
  border-radius: 18px;
  padding: 20px;
  border: 2px solid #35649f;
}

.modal-title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 18px;
}

.station-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.station-option {
  background: #173964;
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: 0.2s;
  font-weight: bold;
}

.station-option:hover {
  background: #245089;
}

.close-btn {
  width: 100%;
  margin-top: 16px;
  background: #5d6d7e;
}

.close-btn:hover {
  background: #74879c;
}

@media (max-width: 600px) {

  .container {
    padding: 18px 12px 30px;
  }

  h1 {
    font-size: 34px;
  }

  .grid {
    gap: 10px;
  }

  .cell {
    min-height: 74px;
    font-size: 14px;
    padding: 8px;
  }

  button {
    width: 100%;
    font-size: 17px;
  }

  .result {
    font-size: 20px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    🚆
  </div>

  <h1>The Route</h1>

  <div class="subtitle">
    Tap each box to choose a station
  </div>

  <div
    class="grid"
    id="grid">
  </div>

  <div class="controls">

    <button id="submitBtn">
      Submit Answers
    </button>

  </div>

  <div
    class="result"
    id="result">
  </div>

</div>

<div
  class="modal"
  id="modal">

  <div class="modal-content">

    <div class="modal-title">
      Select a Station
    </div>

    <div
      class="station-list"
      id="stationList">
    </div>

    <button
      class="close-btn"
      id="closeModalBtn">
      Close
    </button>

  </div>

</div>

<script>

let stations = [];

const answers = [
  "London Victoria",
  "Bromley South",
  "Rochester",
  "Canterbury East",
  "Margate",
  "Dover Priory",
  "Tunbridge Wells",
  "Hastings"
];

const boardState = [
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null },
  { value: "", correct: null }
];

const grid = document.getElementById("grid");

const modal = document.getElementById("modal");

const stationList = document.getElementById("stationList");

const result = document.getElementById("result");

let currentCellIndex = null;

async function loadStations() {

  try {

    const response = await fetch("southeastern.json");

    stations = await response.json();

    renderGrid();

  } catch (error) {

    console.error(error);

    alert("Could not load southeastern.json");

  }

}

function renderGrid() {

  grid.innerHTML = "";

  boardState.forEach((cellData, index) => {

    const cell = document.createElement("div");

    cell.className = "cell";

    if (cellData.value === "") {

      cell.classList.add("empty");

      cell.textContent = "Select Station";

    } else {

      cell.textContent = cellData.value;

    }

    if (cellData.correct === true) {

      cell.classList.add("correct");

    }

    if (cellData.correct === false) {

      cell.classList.add("incorrect");

    }

    cell.addEventListener("click", () => {

      openModal(index);

    });

    grid.appendChild(cell);

  });

}

function openModal(index) {

  currentCellIndex = index;

  stationList.innerHTML = "";

  stations.forEach((station) => {

    const option = document.createElement("div");

    option.className = "station-option";

    option.textContent = station;

    option.addEventListener("click", () => {

      boardState[currentCellIndex].value = station;

      boardState[currentCellIndex].correct = null;

      renderGrid();

      closeModal();

    });

    stationList.appendChild(option);

  });

  modal.style.display = "flex";

}

function closeModal() {

  modal.style.display = "none";

}

function validateBoard() {

  let score = 0;

  boardState.forEach((cell, index) => {

    if (cell.value === answers[index]) {

      cell.correct = true;

      score++;

    } else {

      cell.correct = false;

    }

  });

  renderGrid();

  result.textContent = `You scored ${score} / 8`;

}

document
  .getElementById("submitBtn")
  .addEventListener("click", validateBoard);

document
  .getElementById("closeModalBtn")
  .addEventListener("click", closeModal);

window.addEventListener("click", (event) => {

  if (event.target === modal) {

    closeModal();

  }

});

loadStations();

</script>

</body>

</html>
