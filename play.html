<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>The Route</title>

<style>

body {

  margin: 0;
  padding: 16px;

  background: #000d2b;
  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 920px;
  margin: auto;

}

.header {

  text-align: center;
  margin-bottom: 20px;

}

.header img {

  width: 58px;
  margin-bottom: 10px;

}

.header h1 {

  font-size: 54px;
  margin: 0;
  font-weight: 800;

}

.header p {

  margin-top: 6px;
  color: #a7a7a7;
  font-size: 20px;

}

.service-update {

  border: 1px solid #1d4ed8;
  border-radius: 14px;

  padding: 16px;

  background: rgba(255,255,255,0.03);

  margin-bottom: 18px;

}

.service-update h2 {

  margin: 0 0 10px 0;

  color: #22dd66;

  letter-spacing: 3px;
  font-size: 16px;

}

.service-update p {

  margin: 0;

  line-height: 1.4;
  color: #d7d7d7;

}

.grid-wrapper {

  overflow-x: auto;
  padding-bottom: 8px;

}

.grid {

  display: grid;

  grid-template-columns:
    92px
    repeat(4, 92px);

  gap: 8px;

  width: max-content;

}

.corner {

  visibility: hidden;

}

.column-header {

  background: rgba(255,255,255,0.035);

  border-radius: 14px;

  padding: 10px;

  min-height: 72px;

  text-align: center;

  display: flex;
  flex-direction: column;
  justify-content: center;

}

.column-header h3 {

  margin: 0;
  font-size: 18px;

}

.column-header p {

  margin-top: 6px;

  font-size: 12px;
  color: #d0d0d0;

  line-height: 1.2;

}

.row-header {

  background: rgba(255,255,255,0.035);

  border-radius: 14px;

  padding: 10px;

  min-height: 78px;

  text-align: center;

  display: flex;
  flex-direction: column;
  justify-content: center;

}

.row-header.platform1 {

  border-left: 4px solid #22dd66;

}

.row-header.platform2 {

  border-left: 4px solid #66aaff;

}

.row-header h3 {

  margin: 0;
  font-size: 15px;

}

.row-header p {

  margin-top: 6px;

  font-size: 11px;
  color: #d0d0d0;

  line-height: 1.2;

}

.cell {

  border: 1px solid #1d4ed8;

  border-radius: 14px;

  width: 92px;
  height: 78px;

  background: rgba(255,255,255,0.02);

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  cursor: pointer;

  transition: 0.2s;

  padding: 6px;

  box-sizing: border-box;

}

.cell:hover {

  background: rgba(255,255,255,0.05);

}

.station-name {

  font-size: 13px;
  font-weight: bold;

  line-height: 1.15;

}

.status {

  margin-top: 4px;

  font-size: 9px;

  letter-spacing: 1px;

  color: rgba(255,255,255,0.8);

}

.valid {

  background: #066a30;
  border-color: #22dd66;

}

.invalid {

  background: #991b1b;
  border-color: #ff5555;

}

.ticket-box {

  margin-top: 18px;

  background: rgba(255,255,255,0.03);

  border-radius: 14px;

  padding: 18px;

  font-size: 18px;

}

.submit-button {

  width: 100%;

  margin-top: 18px;

  padding: 18px;

  border: none;
  border-radius: 14px;

  background: #22cc66;

  color: white;

  font-size: 24px;
  font-weight: bold;

  cursor: pointer;

}

.submit-button:hover {

  opacity: 0.94;

}

.route-key {

  margin-top: 18px;

  border: 1px solid #1d4ed8;

  border-radius: 14px;

  padding: 16px;

  background: rgba(255,255,255,0.03);

}

.route-key h2 {

  color: #22dd66;

  letter-spacing: 3px;

  font-size: 16px;

  margin-top: 0;

}

.special-announcement {

  margin-top: 18px;

  border: 2px solid #22dd66;

  border-radius: 14px;

  padding: 18px;

  background: rgba(255,255,255,0.03);

  display: none;

  text-align: center;

}

.special-announcement h2 {

  color: #22
