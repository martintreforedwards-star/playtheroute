<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Waiting Room | The Route</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
  rel="stylesheet">

<style>

body {

  margin: 0;

  font-family: 'Inter', sans-serif;

  background:
    radial-gradient(
      circle at top,
      #0b1836 0%,
      #030817 45%,
      #01040d 100%
    );

  color: white;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 24px;

}

.card {

  max-width: 520px;

  background: #111827;

  border: 2px solid #1e3a8a;

  border-radius: 24px;

  padding: 36px 28px;

}

h1 {

  margin-top: 0;

  font-size: 2.4rem;

}

p {

  color: #d1d5db;

  line-height: 1.7;

  font-size: 1rem;

}

.status {

  margin: 24px 0;

  color: #22c55e;

  font-weight: 700;

}

.back-button {

  display: inline-block;

  margin-top: 10px;

  background: #22c55e;

  color: white;

  text-decoration: none;

  padding: 14px 22px;

  border-radius: 16px;

  font-weight: 700;

}

</style>

</head>

<body>

<div class="card">

  <h1>
    🚉 Waiting Room
  </h1>

  <p>

    This commuter network is still being prepared for departure.

  </p>

  <div class="status">

    20 networks are currently live.

  </div>

  <p>

    This one will be arriving soon - pick a live network in the
    meantime.

  </p>

  <a
    href="index.html"
    class="back-button">

    Return to network map

  </a>

</div>

</body>

</html>
