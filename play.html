<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 500px;
  margin: 30px auto;
}

.cell {
  background: white;
  border: 2px solid #ccc;
  border-radius: 12px;
  min-height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  font-weight: bold;
}

.cell.correct {
  background: #dcfce7;
  border-color: green;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);

  display: flex;
  align-items: center;
  justify-content: center;
}

.hidden {
  display: none;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 12px;
  width: 300px;
}

.station-option {
  padding: 10px;
  cursor: pointer;
}

.station-option:hover {
  background: #eee;
}

</style>
</head>

<body>

<h1>The Route</h1>

<div class="grid" id="grid"></div>

<div class="modal hidden" id="modal">

  <div class="modal-content">

    <h3>Select Station</h3>

    <div id="stationList"></div>

  </div>

</div>

<script>

const answers = [
  "Ramsgate",
  "Broadstairs",
  "Margate",
  "Dumpton Park"
];

const stations = [
  "Ramsgate",
  "Broadstairs",
  "Margate",
  "Dumpton Park",
  "Canterbury West",
  "Deal"
];

const grid = document.getElementById("grid");

const modal = document.getElementById("modal");

const stationList = document.getElementById("stationList");

let activeCell = null;

answers.forEach(answer => {

  const cell = document.createElement("div");

  cell.className = "cell";

  cell.textContent = "Select Station";

  cell.dataset.answer = answer;

  cell.onclick = () => {

    activeCell = cell;

    openModal();

  };

  grid.appendChild(cell);

});

function openModal() {

  modal.classList.remove("hidden");

  stationList.innerHTML = "";

  stations.forEach(station => {

    const option = document.createElement("div");

    option.className = "station-option";

    option.textContent = station;

    option.onclick = () => {

      checkAnswer(station);

    };

    stationList.appendChild(option);

  });

}

function checkAnswer(station) {

  if (station === activeCell.dataset.answer) {

    activeCell.textContent = station;

    activeCell.classList.add("correct");

  } else {

    alert("Incorrect");

  }

  modal.classList.add("hidden");

}

</script>

</body>
</html>
