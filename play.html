<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
  rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family: 'Inter', sans-serif;

  background:
    radial-gradient(
      circle at top,
      #0b1836 0%,
      #030817 45%,
      #01040d 100%
    );

  color: white;

}

.container {

  width: 100%;
  max-width: 900px;

  margin: auto;

  padding: 20px 16px 120px;

}

/* HEADER */

.header {

  text-align: center;

  margin-bottom: 24px;

}

.logo {

  width: 80px;

  margin-bottom: 14px;

}

h1 {

  margin: 0;

  font-size: 2.4rem;

  letter-spacing: -1px;

}

.subtitle {

  margin-top: 10px;

  color: #9ca3af;

  font-size: 1rem;

}

/* SERVICE PANEL */

.service-panel {

  background: #111827;

  border: 2px solid #1e3a8a;

  border-radius: 18px;

  padding: 16px;

  margin-bottom: 18px;

}

.service-title {

  font-size: 0.9rem;

  color: #22c55e;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 1px;

  margin-bottom: 10px;

}

.service-message {

  color: #d1d5db;

  line-height: 1.5;

  font-size: 0.95rem;

}

/* COLUMN CLUES */

.column-grid {

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 10px;

  margin-bottom: 16px;

}

.column-header {

  background: #111827;

  border-radius: 16px;

  padding: 12px;

  text-align: center;

  min-height: 100px;

}

.column-letter {

  font-size: 1.4rem;

  font-weight: 700;

  margin-bottom: 8px;

}

.column-clue {

  font-size: 0.8rem;

  line-height: 1.4;

  color: #9ca3af;

}

/* ROWS */

.platform-row {

  margin-bottom: 18px;

}

.platform {

  background: #111827;

  border-left: 5px solid #22c55e;

  border-radius: 18px;

  padding: 14px;

  margin-bottom: 10px;

}

.platform.blue {

  border-left-color: #60a5fa;

}

.platform-title {

  font-size: 1rem;

  font-weight: 700;

  margin-bottom: 6px;

}

.platform-condition {

  font-size: 0.9rem;

  color: #9ca3af;

}

/* CELLS */

.row-cells {

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 10px;

}

.cell {

  background: #0f172a;

  border: 2px solid #1e3a8a;

  border-radius: 18px;

  min-height: 95px;

  padding: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  cursor: pointer;

  transition: 0.2s;

}

.cell:hover {

  border-color: #22c55e;

}

.cell.correct {

  background: #052e16;

  border-color: #22c55e;

}

.cell.incorrect {

  background: #450a0a;

  border-color: #ef4444;

}

.cell-content {

  display: flex;

  flex-direction: column;

  gap: 6px;

}

.station {

  font-size: 0.9rem;

  font-weight: 700;

  line-height: 1.3;

}

.label {

  font-size: 0.72rem;

  text-transform: uppercase;

  letter-spacing: 1px;

  color: #cbd5e1;

}

/* FOOTER BAR */

.footer-bar {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  background: rgba(3,8,23,0.96);

  backdrop-filter: blur(10px);

  border-top: 1px solid #1e293b;

  padding: 14px;

}

.footer-inner {

  width: 100%;
  max-width: 900px;

  margin: auto;

  display: flex;

  gap: 12px;

  align-items: center;

}

.tickets {

  background: #111827;

  border-radius: 14px;

  padding: 14px 16px;

  font-size: 0.9rem;

  white-space: nowrap;

}

.submit-button {

  flex: 1;

  border: none;

  background: #22c55e;

  color: white;

  border-radius: 16px;

  padding: 16px;

  font-size: 1rem;

  font-weight: 700;

  cursor: pointer;

}

/* COMPLETE */

.complete {

  margin-top: 24px;

  background: #052e16;

  border: 2px solid #22c55e;

  border-radius: 18px;

  padding: 20px;

  display: none;

}

.complete h2 {

  margin-top: 0;

}

/* MODAL */

.modal {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.75);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.hidden {

  display: none;

}

.modal-box {

  width: 100%;
  max-width: 500px;

  background: #111827;

  border-radius: 22px;

  padding: 20px;

}

#searchBox {

  width: 100%;

  padding: 16px;

  border-radius: 14px;

  border: none;

  background: #0f172a;

  color: white;

  font-size: 1rem;

  margin-bottom: 16px;

}

.station-option {

  padding: 14px;

  border-radius: 12px;

  cursor: pointer;

  transition: 0.2s;

}

.station-option:hover {

  background: #1e293b;

}

/* MOBILE */

@media (max-width: 700px) {

  .column-grid {

    gap: 8px;

  }

  .column-header {

    padding: 10px;

    min-height: 90px;

  }

  .column-letter {

    font-size: 1.1rem;

  }

  .column-clue {

    font-size: 0.7rem;

  }

  .row-cells {

    gap: 8px;

  }

  .cell {

    min-height: 82px;

    padding: 8px;

  }

  .station {

    font-size: 0.78rem;

  }

  .footer-inner {

    flex-direction: column;

  }

  .tickets {

    width: 100%;

    text-align: center;

  }

  .submit-button {

    width: 100%;

  }

}

</style>

</head>
