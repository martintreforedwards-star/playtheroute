<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>The Route — Play</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="./assets/css/style.css">

</head>

<body>

  <div class="container">

    <img
      src="logo.svg"
      alt="The Route logo"
      class="logo">

    <h1>The Route</h1>

    <p class="subtitle">
      Today's Puzzle
    </p>

    <div
      class="tickets"
      id="tickets">

      🎫 🎫 🎫

    </div>

    <div
      id="message"
      class="message">
    </div>

    <div class="game-grid">

      <!-- HEADER ROW -->

      <div class="blank"></div>

      <div class="clue-header">
        Nearby to...
      </div>

      <div class="clue-header">
        Out of town to...
      </div>

      <div class="clue-header">
        Interchange with...
      </div>

      <div class="clue-header">
        Coastal route...
      </div>

      <!-- PLATFORM 1 -->

      <div class="platform-label">
        Platform 1
      </div>

      <div
        class="cell"
        data-cell="cell1"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell2"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell3"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell4"
        onclick="selectCell(this)">
      </div>

      <!-- PLATFORM 2 -->

      <div class="platform-label">
        Platform 2
      </div>

      <div
        class="cell"
        data-cell="cell5"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell6"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell7"
        onclick="selectCell(this)">
      </div>

      <div
        class="cell"
        data-cell="cell8"
        onclick="selectCell(this)">
      </div>

      <!-- PLATFORM 3 -->

      <div class="platform-label">
        Platform 3
      </div>

      <div
        class="cell"
        data-cell="cell9"
        onclick="selectCell(this)">
      </div>

      <div class="blank"></div>

      <div class="blank"></div>

      <div class="blank"></div>

    </div>

    <div class="input-area">

      <input
        id="stationInput"
        placeholder="Enter station">

      <button onclick="placeStation()">
        Add Station
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
