<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>The Route</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
  rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family: 'Inter', sans-serif;

  background:
    radial-gradient(
      circle at top,
      #0b1836 0%,
      #030817 45%,
      #01040d 100%
    );

  color: white;

  min-height: 100vh;

}

.container {

  width: 100%;
  max-width: 520px;

  margin: auto;

  padding: 28px 18px 40px;

}

/* HEADER */

.header {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 18px;

  margin-bottom: 26px;

}

.logo {

  width: 82px;

  flex-shrink: 0;

}

.header-text {

  display: flex;

  flex-direction: column;

  justify-content: center;

}

h1 {

  margin: 0;

  font-size: 2.8rem;

  line-height: 1;

  letter-spacing: -1px;

}

.subtitle {

  margin-top: 8px;

  color: #9ca3af;

  font-size: 1rem;

}

/* ANNOUNCEMENT */

.announcement {

  background: #111827;

  border: 2px solid #1e3a8a;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 26px;

  line-height: 1.6;

  color: #d1d5db;

  font-size: 0.95rem;

}

/* NETWORK SELECTOR */

.network-selector {

  margin-bottom: 24px;

}

.network-selector label {

  display: block;

  margin-bottom: 10px;

  font-size: 0.95rem;

  font-weight: 600;

  color: #d1d5db;

}

select {

  width: 100%;

  padding: 16px;

  border-radius: 16px;

  border: 2px solid #1e3a8a;

  background: #111827;

  color: white;

  font-size: 1rem;

  font-family: inherit;

}

optgroup {

  font-weight: 700;

}

option {

  font-size: 0.95rem;

}

/* PLAY BUTTON */

.play-button {

  display: block;

  width: 100%;

  text-align: center;

  background: #22c55e;

  color: white;

  text-decoration: none;

  font-weight: 700;

  font-size: 1rem;

  padding: 18px;

  border-radius: 18px;

  margin-bottom: 24px;

  transition: 0.2s;

}

.play-button:hover {

  opacity: 0.9;

}

/* FOOTER */

.footer-text {

  text-align: center;

  color: #6b7280;

  font-size: 0.82rem;

  line-height: 1.5;

}

/* MOBILE */

@media (max-width: 700px) {

  .container {

    padding-top: 22px;

  }

  .header {

    gap: 14px;

    margin-bottom: 22px;

  }

  .logo {

    width: 68px;

  }

  h1 {

    font-size: 2.2rem;

  }

  .subtitle {

    font-size: 0.88rem;

  }

  .announcement {

    padding: 16px;

    font-size: 0.9rem;

  }

  select {

    font-size: 0.92rem;

    padding: 14px;

  }

  option {

    font-size: 0.9rem;

  }

}

</style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <img
      src="logo.svg"
      alt="The Route Logo"
      class="logo">

    <div class="header-text">

      <h1>The Route</h1>

      <div class="subtitle">

        Build the route. Find the pattern.

      </div>

    </div>

  </div>

  <!-- ANNOUNCEMENT -->

  <div class="announcement">

    🚉 Service update:
    The Route is preparing for departure.
    Daily commuter puzzles arriving soon.

  </div>

  <!-- NETWORK SELECTOR -->

  <div class="network-selector">

    <label for="network">

      Choose your commuter network

    </label>

    <select id="network">

      <optgroup label="Govia Thameslink Railway (GTR)">

        <option>Thameslink</option>

        <option>Southern</option>

        <option>Great Northern</option>

        <option>Gatwick Express</option>

      </optgroup>

      <optgroup label="Southeastern">

        <option>Southeastern Metro</option>

        <option>Southeastern Mainline</option>

      </optgroup>

      <optgroup label="Greater Anglia">

        <option>Greater Anglia</option>

        <option>c2c</option>

      </optgroup>

      <optgroup label="Other Networks">

        <option>South Western Railway</option>

        <option>Chiltern Railways</option>

        <option>Great Western Railway</option>

        <option>East Midlands Railway</option>

        <option>LNER</option>

      </optgroup>

    </select>

  </div>

  <!-- PLAY BUTTON -->

  <a
    href="play.html"
    class="play-button">

    Play today's Route

  </a>

  <!-- FOOTER -->

  <div class="footer-text">

    Built for UK commuters.

  </div>

</div>

</body>

</html>
