<!-- FILE: play.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>The Route</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">
    <h1>The Route</h1>
    <p class="subtitle">Daily Commuter Puzzle</p>
  </header>

  <main class="game-container">

    <section class="announcement">
      <strong>Service Announcement:</strong>
      Southeastern services are currently operating normally.
    </section>

    <section class="theme-box">
      <h2>Today's Theme</h2>
      <p>Kent Coast Loop</p>
    </section>

    <section id="grid" class="grid"></section>

  </main>

  <!-- MODAL -->

  <div id="modal" class="modal hidden">

    <div class="modal-content">

      <button id="closeModal" class="close-btn">
        ×
      </button>

      <h3>Select Station</h3>

      <input
        type="text"
        id="stationSearch"
        placeholder="Search station..."
      />

      <div id="stationList" class="station-list"></div>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
