<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>The Route — Southeastern Alpha</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="./assets/css/style.css">

</head>

<body>

  <div class="container">

    <h1>The Route</h1>

    <p class="subtitle">
      Southeastern Alpha 001
    </p>

    <div
      class="tickets"
      id="tickets">

      🎟 🎟 🎟 🎟 🎟

    </div>

    <div
      id="message"
      class="message">
    </div>

    <div class="board-wrapper">

      <div class="column-headers">

        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>

      </div>

      <div class="platform-row">

        <div class="platform-title platform-one">
          PLATFORM 1
        </div>

        <div
          class="cell"
          data-column="A"
          onclick="selectCell(this)">

          <div class="station-name">
            Chatham
          </div>

          <div class="status-text">
            arriving
          </div>

        </div>

        <div
          class="cell"
          data-column="B"
          onclick="selectCell(this)">

          <div class="station-name">
            Dartford
          </div>

          <div class="status-text">
            delayed
          </div>

        </div>

        <div
          class="cell"
          data-column="C"
          onclick="selectCell(this)">

          <div class="station-name">
            Lewisham
          </div>

          <div class="status-text">
            waiting
          </div>

        </div>

        <div
          class="cell"
          data-column="D"
          onclick="selectCell(this)">

          <div class="station-name small-text">
            Charing Cross
          </div>

          <div class="status-text">
            arriving
          </div>

        </div>

      </div>

      <div class="platform-row">

        <div class="platform-title platform-two">
          PLATFORM 2
        </div>

        <div
          class="cell"
          data-column="A"
          onclick="selectCell(this)">

          <div class="station-name">
            Fulham
          </div>

          <div class="status-text">
            delayed
          </div>

        </div>

        <div
          class="cell"
          data-column="B"
          onclick="selectCell(this)">

          <div class="station-name">
            Deptford
          </div>

          <div class="status-text">
            waiting
          </div>

        </div>

        <div
          class="cell"
          data-column="C"
          onclick="selectCell(this)">

          <div class="station-name small-text">
            London Bridge
          </div>

          <div class="status-text">
            arriving
          </div>

        </div>

        <div
          class="cell"
          data-column="D"
          onclick="selectCell(this)">

          <div class="station-name small-text">
            Cannon Street
          </div>

          <div class="status-text">
            delayed
          </div>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="submitPair()">
        Submit Pair
      </button>

      <button
        class="secondary-button"
        onclick="clearSelection()">

        Clear

      </button>

    </div>

    <div
      id="splitFlap"
      class="split-flap hidden">

      <div class="split-title">
        SERVICE UPDATE
      </div>

      <div
        id="flapLine1"
        class="flap-line">

        THAMESLINK

      </div>

      <div
        id="flapLine2"
        class="flap-line">

        HIGH SPEED

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
