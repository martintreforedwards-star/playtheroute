<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>The Route</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="./assets/css/style.css">

</head>

<body>

  <div class="container">

    <img
      src="logo.svg"
      alt="The Route logo"
      class="logo">

    <div class="announcement">

      🚉 Service update:
      The Route is preparing for departure.
      Daily commuter puzzles arriving soon.

    </div>

    <h1>The Route</h1>

    <p class="subtitle">
      Build the route. Find the pattern.
    </p>

    <!-- NETWORK SELECT -->

    <div class="network-selector">

      <label for="network">

        Choose your commuter network

      </label>

      <select
        id="network">

        <option>Thameslink</option>

        <option>Southern</option>

        <option>Great Northern</option>

        <option>Southeastern</option>

        <option>Greater Anglia</option>

        <option>c2c</option>

        <option>South Western Railway</option>

        <option>Great Western Railway</option>

        <option>Elizabeth line</option>

        <option>Chiltern Railways</option>

      </select>

    </div>

    <!-- PLAY BUTTON -->

    <a
      href="play.html"
      class="play-button"
      onclick="saveNetwork()">

      Play Today's Route

    </a>

    <p class="footer-note">
      Built for UK commuters.
    </p>

  </div>

  <script>

    function saveNetwork() {

      const selectedNetwork =
        document.getElementById(
          "network"
        ).value;

      localStorage.setItem(
        "routeNetwork",
        selectedNetwork
      );
    }

    /* LOAD SAVED NETWORK */

    window.onload = function() {

      const savedNetwork =
        localStorage.getItem(
          "routeNetwork"
        );

      if (savedNetwork) {

        document.getElementById(
          "network"
        ).value = savedNetwork;
      }
    }

  </script>

</body>

</html>
