<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>playtheroute.uk — Network Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030817; --panel-bg: rgba(17, 24, 39, 0.94); --panel-border: #1e3a8a;
    --text: #ffffff; --text-dim: #9ca3af; --accent: #22c55e;
    --coast-fill: #0f1b33; --coast-stroke: #1e3a8a; --station: #ffffff;
    --encroach: #4b5563;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; height: 100dvh; background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); overflow: hidden; overscroll-behavior: none; touch-action: none;
    position: fixed; width: 100%; -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
  svg#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; background: var(--bg); }
  svg#map.dragging { cursor: grabbing; }
  path.coast { fill: var(--coast-fill); stroke: var(--coast-stroke); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  path.own-edge { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0.95; cursor: pointer; }
  path.encroach-edge { fill: none; stroke: var(--encroach); stroke-width: 1.1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; opacity: 0.65; }
  circle.own-station { fill: var(--station); vector-effect: non-scaling-stroke; cursor: pointer; }
  circle.encroach-station { fill: var(--encroach); vector-effect: non-scaling-stroke; opacity: 0.7; cursor: pointer; }
  text.own-label { font-size: 0.9px; fill: var(--text); pointer-events: auto; cursor: pointer; paint-order: stroke; stroke: var(--bg); stroke-width: 0.18px; stroke-linejoin: round; }
  text.encroach-label { font-size: 0.8px; fill: var(--text-dim); pointer-events: auto; cursor: pointer; paint-order: stroke; stroke: var(--bg); stroke-width: 0.15px; stroke-linejoin: round; opacity: 0.8; }
  line.own-leader { stroke: var(--text-dim); stroke-width: 0.35; vector-effect: non-scaling-stroke; opacity: 0.55; pointer-events: none; }
  line.encroach-leader { stroke: var(--text-dim); stroke-width: 0.3; vector-effect: non-scaling-stroke; opacity: 0.4; pointer-events: none; }

  #top-panel {
    position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 12px 16px; backdrop-filter: blur(6px); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #top-panel h1 { font-size: 14px; margin: 0; font-weight: 600; flex-shrink: 0; }
  #network-select {
    flex: 1; min-width: 180px; background: #0c1424; border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 8px 10px; color: var(--text); font-size: 13px;
  }
  #legend-line {
    display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text-dim);
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 8px 14px; flex-wrap: wrap; backdrop-filter: blur(6px);
  }
  .swatch-line { display: inline-flex; align-items: center; gap: 5px; }
  .swatch-dash { width: 16px; height: 0; border-top: 2px dashed var(--encroach); display: inline-block; }
  .swatch-solid { width: 16px; height: 2px; background: var(--accent); display: inline-block; border-radius: 1px; }

  #side-toggle {
    display: none; position: absolute; bottom: 16px; left: 16px; z-index: 11;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 22px;
    padding: 10px 16px; font-size: 12px; color: var(--text); align-items: center; gap: 6px; cursor: pointer;
  }
  #side-panel {
    display: none; position: absolute; bottom: 16px; left: 16px; z-index: 12; width: 260px; max-height: 60vh;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 12px 14px; flex-direction: column;
  }
  #side-panel.open { display: flex; }
  #side-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #side-header h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0; }
  #side-close { cursor: pointer; color: var(--text-dim); font-size: 16px; padding: 4px 6px; border-radius: 6px; }
  #side-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  #display-toggles { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); }
  .side-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 2px; cursor: pointer; border-radius: 5px; }
  .side-row:hover { background: rgba(255,255,255,0.05); }
  .side-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
  .side-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .side-row .sr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #route-search {
    width: 100%; box-sizing: border-box; background: #0c1424; border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 6px 8px; color: var(--text); font-size: 12px; margin-bottom: 8px;
  }
  #route-search::placeholder { color: var(--text-dim); }
  #route-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .mini-btn {
    font-size: 10.5px; color: var(--accent); background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
    border-radius: 5px; padding: 3px 8px; cursor: pointer;
  }
  .mini-btn:hover { background: rgba(34,197,94,0.2); }
  #route-scroll { overflow-y: auto; flex: 1; }

  #controls { position: absolute; top: 100px; right: 16px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  .ctrl-btn {
    width: 40px; height: 40px; border-radius: 8px; background: var(--panel-bg); border: 1px solid var(--panel-border);
    color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .ctrl-btn:hover { background: rgba(34, 197, 94, 0.12); border-color: var(--accent); }

  #tooltip {
    position: absolute; z-index: 20; pointer-events: none; background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; font-size: 12px; display: none; white-space: nowrap;
  }
  #tooltip .route-name { font-weight: 600; color: var(--text); }
  #tooltip .op-name { color: var(--text-dim); font-size: 11px; }

  #empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5;
    color: var(--text-dim); font-size: 13px; text-align: center; pointer-events: none;
  }

  @media (max-width: 640px), (pointer: coarse) {
    #top-panel { flex-direction: column; align-items: stretch; }
    #top-panel h1 { font-size: 13px; }
    #legend-line { font-size: 10px; }
    .ctrl-btn { width: 46px; height: 46px; font-size: 22px; }
    #controls { top: auto; bottom: 16px; right: 16px; }
    #tooltip { left: 12px; right: 12px; bottom: 12px; top: auto; white-space: normal; font-size: 13px; padding: 10px 14px; }
    #side-panel { left: 0; right: 0; bottom: 0; width: auto; max-height: 42vh; border-radius: 14px 14px 0 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
    .side-row { font-size: 11.5px; }
  }
</style>
</head>

const LON_MIN = -8.2, LON_MAX = 2.0, LAT_MIN = 49.8, LAT_MAX = 60.9;
const W = 900, H = 1300;
function project(lat, lon) {
  const x = (lon - LON_MIN) / (LON_MAX - LON_MIN) * W;
  const y = (LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * H;
  return [x, y];
}

// populate dropdown
const quizIds = Object.keys(QUIZ_LABELS).sort((a,b) => QUIZ_LABELS[a].localeCompare(QUIZ_LABELS[b]));
quizIds.forEach(qid => {
  const opt = document.createElement('option');
  opt.value = qid;
  opt.textContent = QUIZ_LABELS[qid];
  select.appendChild(opt);
});

const stationByName = {};
STATIONS.forEach(([name, lat, lon, qid, crs]) => { stationByName[name] = { lat, lon, qid, crs }; });

const baseVB = { x: 0, y: 0, w: W, h: H };
let viewBox = { ...baseVB };

const OWN_DOT_PX = 1.8, ENCROACH_DOT_PX = 1.3; // constant on-screen size, independent of zoom

function applyViewBox() {
  svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
  const rect = svg.getBoundingClientRect();
  if (rect.width > 0) {
    const unitsPerPx = viewBox.w / rect.width;
    const ownR = (OWN_DOT_PX * unitsPerPx).toFixed(3);
    const encR = (ENCROACH_DOT_PX * unitsPerPx).toFixed(3);
    dynamicG.querySelectorAll('circle.own-station').forEach(el => el.setAttribute('r', ownR));
    dynamicG.querySelectorAll('circle.encroach-station').forEach(el => el.setAttribute('r', encR));
  }
}

function clampW(w) {
  return Math.max(baseVB.w / MAX_ZOOM, Math.min(baseVB.w / MIN_ZOOM, w));
}

let stationRoutes = {}; // encroach station name -> Set of route names referencing it (for filter visibility)
let currentRouteList = []; // [name, color] touching the current network

// Places short CRS-code labels near their dots, nudging a label into open space
// (with a thin leader line back to its dot) only when it would otherwise collide
// with an already-placed label. Runs once per network selection, not per frame.
function placeLabels(points, fontSize, labelClass, leaderClass) {
  const charW = fontSize * 0.68;
  const boxH = fontSize * 1.3;
  const margin = fontSize * 0.35; // extra buffer so near-touching labels still count as a collision
  const baseGap = 1.0; // gap between dot and default label position
  const placed = []; // {x1,y1,x2,y2} bounding boxes already committed

  function boxFor(cx, cy, text, align) {
    const w = text.length * charW;
    const x1 = (align === 'left' ? cx - w : cx) - margin;
    return { x1, y1: cy - boxH * 0.8 - margin, x2: x1 + w + margin*2, y2: cy + boxH * 0.3 + margin };
  }
  function overlaps(a, b) {
    return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
  }
  function overlapCount(box) {
    let n = 0;
    for (const p of placed) if (overlaps(box, p)) n++;
    return n;
  }

  // candidate offsets tried in order: default (right, slightly up), then rings
  // of alternates at growing distance if closer spots are already taken
  const candidates = [
    [ baseGap,      -baseGap*0.7,  'left'  ],
    [ baseGap,       baseGap*1.6,  'left'  ],
    [-baseGap,      -baseGap*0.7,  'right' ],
    [-baseGap,       baseGap*1.6,  'right' ],
    [ baseGap*2.4,  -baseGap*0.7,  'left'  ],
    [ baseGap*2.4,   baseGap*2.6,  'left'  ],
    [-baseGap*2.4,  -baseGap*0.7,  'right' ],
    [-baseGap*2.4,   baseGap*2.6,  'right' ],
    [ 0,            -baseGap*3.4,  'left'  ],
    [ 0,             baseGap*4.2,  'left'  ],
    [ baseGap*4.2,   baseGap*1,    'left'  ],
    [-baseGap*4.2,   baseGap*1,    'right' ],
    [ baseGap*4.2,  -baseGap*3.4,  'left'  ],
    [-baseGap*4.2,  -baseGap*3.4,  'right' ],
    [ baseGap*4.2,   baseGap*4.2,  'left'  ],
    [-baseGap*4.2,   baseGap*4.2,  'right' ],
    [ 0,             baseGap*6.0,  'left'  ],
    [ 0,            -baseGap*6.0,  'left'  ],
    [ baseGap*6.2,   0,            'left'  ],
    [-baseGap*6.2,   0,            'right' ],
  ];

  const frags = [];
  points.forEach(({ x, y, name, crs }) => {
    let chosenIdx = -1, chosen = null, bestOverlap = Infinity;
    for (let i = 0; i < candidates.length; i++) {
      const [dx, dy, align] = candidates[i];
      const tx = x + dx, ty = y + dy;
      const box = boxFor(tx, ty, crs, align);
      const n = overlapCount(box);
      if (n === 0) { chosenIdx = i; chosen = { tx, ty, align, box }; break; }
      if (n < bestOverlap) { bestOverlap = n; chosenIdx = i; chosen = { tx, ty, align, box }; }
    }
    placed.push(chosen.box);
    if (chosenIdx > 0) {
      frags.push(`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${chosen.tx.toFixed(1)}" y2="${chosen.ty.toFixed(1)}" class="${leaderClass}" data-station="${name}" />`);
    }
    const anchor = chosen.align === 'right' ? ' text-anchor="end"' : '';
    frags.push(`<text x="${chosen.tx.toFixed(1)}" y="${chosen.ty.toFixed(1)}" class="${labelClass}"${anchor} data-station="${name}" data-crs="${crs}">${crs}</text>`);
  });
  return frags.join('');
}

function renderNetwork(qid) {
  dynamicG.innerHTML = '';
  stationRoutes = {};
  if (!qid) {
    emptyState.style.display = 'block';
    legendLine.style.display = 'none';
    sidePanel.classList.remove('open');
    sideToggle.style.display = 'none';
    viewBox = { ...baseVB };
    applyViewBox();
    return;
  }
  emptyState.style.display = 'none';
  legendLine.style.display = 'flex';
  sideToggle.style.display = 'flex';

  const ownStations = new Set();
  STATIONS.forEach(([name, lat, lon, sqid]) => { if (sqid === qid) ownStations.add(name); });

  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  STATIONS.forEach(([name, lat, lon, sqid]) => {
    if (sqid !== qid) return;
    const [x,y] = project(lat, lon);
    minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
  });

  const ownFrag = [];
  const encroachFrag = [];
  currentRouteList = [];
  Object.entries(ROUTES).forEach(([routeName, r]) => {
    if (!r.quizzes.includes(qid)) return;
    currentRouteList.push([routeName, r.color]);
    r.edges.forEach(e => {
      const aOwn = ownStations.has(e.a), bOwn = ownStations.has(e.b);
      const pts = e.path.map(([lat,lon]) => project(lat,lon));
      const d = "M " + pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ");
      if (aOwn && bOwn) {
        ownFrag.push(`<path d="${d}" class="own-edge" stroke="${r.color}" data-route="${routeName}" data-op="${r.op}" />`);
      } else {
        encroachFrag.push(`<path d="${d}" class="encroach-edge" data-route="${routeName}" data-op="${r.op}" />`);
        [e.a, e.b].forEach(sname => {
          if (!ownStations.has(sname)) {
            (stationRoutes[sname] = stationRoutes[sname] || new Set()).add(routeName);
          }
        });
      }
    });
  });
  currentRouteList.sort((a,b) => a[0].localeCompare(b[0]));

  const ownStationFrag = [];
  const encroachStationFrag = [];
  const encroachSeen = new Set();
  const ownPoints = [];
  const encroachPoints = [];
  STATIONS.forEach(([name, lat, lon, sqid, crs]) => {
    if (sqid !== qid) return;
    const [x,y] = project(lat, lon);
    ownStationFrag.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0.5" class="own-station" data-station="${name}" data-crs="${crs}" />`);
    ownPoints.push({ x, y, name, crs });
  });
  Object.entries(ROUTES).forEach(([routeName, r]) => {
    if (!r.quizzes.includes(qid)) return;
    r.edges.forEach(e => {
      [e.a, e.b].forEach(sname => {
        if (ownStations.has(sname) || encroachSeen.has(sname)) return;
        const st = stationByName[sname];
        if (!st) return;
        encroachSeen.add(sname);
        const [x,y] = project(st.lat, st.lon);
        encroachStationFrag.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0.38" class="encroach-station" data-station="${sname}" data-crs="${st.crs}" />`);
        encroachPoints.push({ x, y, name: sname, crs: st.crs });
      });
    });
  });

  const ownLabelFrag = placeLabels(ownPoints, 0.9, 'own-label', 'own-leader');
  const encroachLabelFrag = placeLabels(encroachPoints, 0.8, 'encroach-label', 'encroach-leader');

  dynamicG.innerHTML = encroachFrag.join('') + ownFrag.join('') + encroachStationFrag.join('') + ownStationFrag.join('') + encroachLabelFrag + ownLabelFrag;

  buildRouteLegend();
  applyLayerFilters();
  wireTooltips();

  // auto-fit view to bounding box of this network (own stations), with padding
  if (isFinite(minX)) {
    const padX = (maxX - minX) * 0.03 + 2;
    const padY = (maxY - minY) * 0.03 + 2;
    let bx = minX - padX, by = minY - padY, bw = (maxX - minX) + padX*2, bh = (maxY - minY) + padY*2;
    // preserve aspect ratio of viewport container
    const targetAspect = baseVB.w / baseVB.h;
    const boxAspect = bw / bh;
    if (boxAspect > targetAspect) {
      const newH = bw / targetAspect;
      by -= (newH - bh) / 2;
      bh = newH;
    } else {
      const newW = bh * targetAspect;
      bx -= (newW - bw) / 2;
      bw = newW;
    }
    viewBox = { x: bx, y: by, w: Math.max(bw, baseVB.w/MAX_ZOOM), h: Math.max(bh, baseVB.h/MAX_ZOOM) };
    applyViewBox();
  }
}

let routeEnabled = {};

function buildRouteLegend() {
  routeEnabled = {};
  currentRouteList.forEach(([name]) => routeEnabled[name] = true);
  renderRouteList();
}

function renderRouteList() {
  const term = routeSearch.value.toLowerCase();
  routeBody.innerHTML = '';
  currentRouteList.forEach(([name, color]) => {
    if (term && !name.toLowerCase().includes(term)) return;
    const row = document.createElement('label');
    row.className = 'side-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = routeEnabled[name] !== false;
    cb.addEventListener('change', () => { routeEnabled[name] = cb.checked; applyLayerFilters(); });
    row.appendChild(cb);
    const sw = document.createElement('span');
    sw.className = 'side-swatch';
    sw.style.background = color;
    row.appendChild(sw);
    const nm = document.createElement('span');
    nm.className = 'sr-name';
    nm.textContent = name;
    row.appendChild(nm);
    routeBody.appendChild(row);
  });
}

function applyLayerFilters() {
  document.querySelectorAll('.own-edge, .encroach-edge').forEach(el => {
    el.style.display = routeEnabled[el.dataset.route] !== false ? '' : 'none';
  });
  document.querySelectorAll('.encroach-station, .encroach-label, .encroach-leader').forEach(el => {
    const routes = stationRoutes[el.dataset.station];
    const visible = routes && Array.from(routes).some(r => routeEnabled[r] !== false);
    el.style.display = visible ? '' : 'none';
  });
  document.querySelectorAll('.own-label, .own-leader').forEach(el => {
    if (!toggleOwnLabels.checked) el.style.display = 'none';
    else if (!el.classList.contains('encroach-label') && !el.classList.contains('encroach-leader')) el.style.display = '';
  });
  document.querySelectorAll('.encroach-label, .encroach-leader').forEach(el => {
    if (!toggleEncroachLabels.checked) { el.style.display = 'none'; }
  });
}

function wireTooltips() {
  if (dynamicG._wired) return;
  dynamicG._wired = true;
  svg.addEventListener('mouseover', (e) => {
    const el = e.target.closest('.own-edge, .encroach-edge');
    if (el) {
      tooltip.style.display = 'block';
      tooltip.innerHTML = `<div class="route-name">${el.dataset.route}</div><div class="op-name">${el.dataset.op}</div>`;
    }
  });
  svg.addEventListener('mousemove', (e) => {
    if (window.matchMedia('(pointer: coarse)').matches) return;
    if (tooltip.style.display === 'block') {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    }
  });
  svg.addEventListener('mouseout', (e) => {
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.own-edge, .encroach-edge')) {
      tooltip.style.display = 'none';
    }
  });
  svg.addEventListener('click', (e) => {
    const el = e.target.closest('.own-station, .own-label, .encroach-station, .encroach-label');
    if (!el) return;
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<div class="route-name">${el.dataset.station}</div><div class="op-name">${el.dataset.crs}</div>`;
    if (!window.matchMedia('(pointer: coarse)').matches) {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    }
  });
}

routeSearch.addEventListener('input', renderRouteList);
routeAllBtn.addEventListener('click', () => {
  currentRouteList.forEach(([name]) => routeEnabled[name] = true);
  renderRouteList(); applyLayerFilters();
});
routeNoneBtn.addEventListener('click', () => {
  currentRouteList.forEach(([name]) => routeEnabled[name] = false);
  renderRouteList(); applyLayerFilters();
});
toggleOwnLabels.addEventListener('change', applyLayerFilters);
toggleEncroachLabels.addEventListener('change', applyLayerFilters);

select.addEventListener('change', () => renderNetwork(select.value));

function zoomAt(clientX, clientY, factor) {
  const rect = svg.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;
  const mx = viewBox.x + px * viewBox.w;
  const my = viewBox.y + py * viewBox.h;
  const newW = clampW(viewBox.w * factor);
  const ratio = newW / viewBox.w;
  viewBox.x = mx - (mx - viewBox.x) * ratio;
  viewBox.y = my - (my - viewBox.y) * ratio;
  viewBox.w = newW;
  viewBox.h = viewBox.h * ratio;
  applyViewBox();
}

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.15 : 1/1.15;
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => {
  const rect = svg.getBoundingClientRect();
  zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, 1/1.4);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  const rect = svg.getBoundingClientRect();
  zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, 1.4);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  if (select.value) renderNetwork(select.value);
});

let isDragging = false, dragStart = null, vbStart = null;
svg.addEventListener('mousedown', (e) => {
  isDragging = true; svg.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY };
  vbStart = { ...viewBox };
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX - dragStart.x) / rect.width * viewBox.w;
  const dy = (e.clientY - dragStart.y) / rect.height * viewBox.h;
  viewBox.x = vbStart.x - dx;
  viewBox.y = vbStart.y - dy;
  applyViewBox();
});
window.addEventListener('mouseup', () => { isDragging = false; svg.classList.remove('dragging'); });

let touchState = null;
svg.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchState = { mode: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY, vb: {...viewBox} };
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchState = { mode: 'pinch', dist: Math.hypot(dx, dy), vb: {...viewBox},
      cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
  }
}, { passive: true });
svg.addEventListener('touchmove', (e) => {
  if (!touchState) return;
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    const dx = (e.touches[0].clientX - touchState.x) / rect.width * touchState.vb.w;
    const dy = (e.touches[0].clientY - touchState.y) / rect.height * touchState.vb.h;
    viewBox.x = touchState.vb.x - dx;
    viewBox.y = touchState.vb.y - dy;
    applyViewBox();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const factor = touchState.dist / dist;
    const newW = clampW(touchState.vb.w * factor);
    const ratio = newW / touchState.vb.w;
    const px = (touchState.cx - rect.left) / rect.width;
    const py = (touchState.cy - rect.top) / rect.height;
    const mx = touchState.vb.x + px * touchState.vb.w;
    const my = touchState.vb.y + py * touchState.vb.h;
    viewBox.x = mx - (mx - touchState.vb.x) * ratio;
    viewBox.y = my - (my - touchState.vb.y) * ratio;
    viewBox.w = newW;
    viewBox.h = touchState.vb.h * ratio;
    applyViewBox();
  }
}, { passive: false });
svg.addEventListener('touchend', () => { touchState = null; });

applyViewBox();
</script>
